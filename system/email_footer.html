<!--
  CVZone Email Footer
  Reused across all campaign emails — do not modify per campaign.
  Include this footer at the bottom of every email HTML file.
-->

<section data-component="footer" style="background-color:#FFFFFF; border-top:1px solid #EEEEEE; margin-top:40px; padding-bottom:40px;">

         style="max-width:600px; margin:0 auto;">

    <!-- Logo + Tagline -->

        <img src="http://www.computervision.zone/wp-content/uploads/2026/03/cvzone_logo.png" alt="CVZone" width="160"
             style="display:block; margin:0 auto; border:0;" />
        <p style="margin:10px 0 0 0; font-family:Arial,sans-serif;
                  font-size:11px; color:#AAAAAA; letter-spacing:3px;
                  text-transform:uppercase;">
          Vision &middot; AI &middot; Robotics
        </p>
      </td>
    </tr>

    <!-- Divider -->
    <tr>
      <td align="center" style="padding:0 24px;">

      </td>
    </tr>

    <!-- Nav Links -->
    <tr>
      <td align="center" style="padding:20px 24px;">
        <a href="https://www.computervision.zone/course-list/"

        </a>
        <span style="color:#DDDDDD;">|</span>
        <a href="https://www.computervision.zone/projects/"

        </a>
        <span style="color:#DDDDDD;">|</span>
        <a href="https://www.computervision.zone/tech-gear/"

        <span style="color:#DDDDDD;">|</span>
